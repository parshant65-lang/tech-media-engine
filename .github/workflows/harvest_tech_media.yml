name: Harvest Tech & Media Intelligence

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: tech-media-runner
  cancel-in-progress: false

jobs:
  harvest-techcrunch:
    name: TechCrunch Global Vault
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Harvester Engine
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run TechCrunch Cloud Harvester
        env:
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
        run: |
          python3 -u harvest_techcrunch.py

  harvest-india-media:
    name: Inc42 & MediaNama India Vault
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Harvester Engine
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run India Media Cloud Harvester
        env:
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
        run: |
          python3 -u harvest_india_media.py

  auto-trigger-next:
    name: Auto Chain Dispatcher
    needs: [harvest-techcrunch, harvest-india-media]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Sleep and Re-trigger Next Cycle
        env:
          GH_TOKEN: ${{ secrets.VAULT_PAT }}
        run: |
          echo "Batch cycle finished. Sleeping 10s and checking next dispatch..."
          sleep 10
          gh workflow run harvest_tech_media.yml --repo parshant65-lang/tech-media-engine || true
